tos no total, sendo 3 suítes, proporcionando conforto e boa distribuição para grupos e famílias.<br /><br />Suíte 1: cama box de casal, cama box de solteiro, ventilador e banheiro privativo.<br />Suíte 2: cama box de casal, ar-condicionado e banheiro privativo.<br />Suíte 3: cama box de casal, cama box de solteiro, ar-condicionado e banheiro privativo.<br /><br />Quarto 4: cama box de casal, cama box de solteiro e ar-condicionado.<br />Quarto 5: cama box de casal, cama box de solteiro e ventilador.<br />Quarto 6: duas camas box de solteiro e ventilador.<br /><br />Há ainda 1 banheiro social completo, atendendo os quartos e áreas comuns.<br /><br />A cozinha é ampla e totalmente equipada, ideal para preparar refeições para grupos.<br /><br />A sala de estar é confortável e integrada aos ambientes sociais da casa.<br /><br />Na área externa, a casa conta com área gourmet com churrasqueira e mesa de jantar, além de piscina privativa e campo de futebol privativo com grama natural, perfeitos para momentos de lazer e diversão.<br /><br />A propriedade dispõe de vaga para até 5 carros, garantindo praticidade durante a estadia. pode chegar até 22 pessoas na acomodação mais o valor será cobrado separadamente.","readMoreButton":null,"textStyle":null,"recommendedNumberOfLines":null,"minimumNumberOfLinesForTruncation":null},"image":null,"kicker":null,"loggingEventData":null,"media":null,"subtitle":null,"subtitleStyle":null,"title":"O espaço","titleStyle":null},{"__typename":"BasicListItem","action":null,"anchor":null,"accessibilityLabel":null,"button":null,"icon":null,"html":{"__typename":"Html","htmlText":"Os hóspedes terão acesso a toda a propriedade, incluindo a casa completa, quartos, banheiros, cozinha, sala de estar, área gourmet com churrasqueira, piscina privativa e campo de futebol privativo.<br /><br />Não há áreas compartilhadas com outros hóspedes.<br />A casa é 100% exclusiva para o grupo durante toda a estadia.","readMoreButton":null,"textStyle":null,"recommendedN s e de amigos com conforto e privacidade.<br />Localização tranquila, a aproximadamente 700 metros da praia, próxima a mercados, padarias e comércios locais.<br /><br /><b>O espaço<\/b><br />A casa oferece 6 quartos no total, sendo 3 suítes, proporcionando conforto e boa distribuição para grupos e famílias.<br /><br />Suíte 1: cama box de casal, cama box de solteiro, ventilador e banheiro privativo.<br />Suíte 2: cama box de casal, ar-condicionado e banheiro privativo.<br />Suíte 3: cama box de casal, cama box de solteiro, ar-condicionado e banheiro privativo.<br /><br />Quarto 4: cama box de casal, cama box de solteiro e ar-condicionado.<br />Quarto 5: cama box de casal, cama box de solteiro e ventilador.<br />Quarto 6: duas camas box de solteiro e ventilador.<br /><br />Há ainda 1 banheiro social completo, atendendo os quartos e áreas comuns.<br /><br />A cozinha é ampla e totalmente equipada, ideal para preparar refeições para grupos.<br /><br />A sala de estar é confortável e integrada aos ambientes sociais da casa.<br /><br />Na área externa, a casa conta com área gourmet com churrasqueira e mesa de jantar, além de piscina privativa e campo de futebol privativo com grama natural, perfeitos para momentos de lazer e diversão.<br /><br />A propriedade dispõe de vaga para até 5 carros, garantindo praticidade durante a estadia. pode chegar até 22 pessoas na acomodação mais o valor será cobrado separadamente.<br /><br /><b>Acesso do hóspede<\/b><br />Os hóspedes terão acesso a toda a propriedade, incluindo a casa completa, quartos, banheiros, cozinha, sala de estar, área gourmet com churrasqueira, piscina privativa e campo de futebol privativo.<br /><br />Não há áreas compartilhadas com outros hóspedes.<br />A casa é 100% exclusiva para o grupo durante toda a estadia.<br /><br /><b>Outras observações<\/b><br />– Não são permitidas festas ou eventos na propriedade.<br />– Não é permitido receber visitantes ou hóspedes extras além dos informados na reserva. Em caso de pessoas adicionais, será cobrada taxa.<br />– Não fornecemos roupas de cama, toalhas, travesseiros, cobertores ou itens de praia. O hóspede deve trazer o necessário.<br />– A piscina não possui aquecimento. Pedimos que tomem ducha antes de entrar, evitem o uso de bronzeadores e não consumam alimentos ou bebidas dentro da piscina.<br />– Qualquer dano, quebra ou avaria deve ser comunicado imediatamente para que possamos resolver da melhor forma possível.<br />– Pets são permitidos somente mediante aviso prévio. Eventuais danos causados por animais serão cobrados.<br />– A taxa de limpeza inclui a limpeza padrão da casa e da piscina. Em situações atípicas ou quando houver necessidade de limpeza extra, poderá ser cobrada taxa adicional. O hóspede deve retirar todo o lixo ao final da estadia.","localizedString":"Casa ampla e completa em Itapoá – SC, ideal para famílias e grupos que buscam lazer e tranquilidade.<br />O imóvel conta com piscina privativa, área gourmet com churrasqueira, Wi-Fi, ar-condicionado, cozinha equipada e ambientes espaçosos.<br />São 6 quartos, sendo 3 suítes, além de amplo jardim e excelente estrutura para receber grupos familiares e de amigos com conforto e privacidade.<br />Localização tranquila, a aproximadamente 700 metros da praia, próxima a mercados, padarias e comércios locais.<br /><br /><b>O espaço<\/b><br />A casa oferece 6 quartos no total, sendo 3 suítes, proporcionando conforto e boa distribuição para grupos e famílias.<br /><br />Suíte 1: cama box de casal, cama box de solteiro, ventilador e banheiro privativo.<br />Suíte 2: cama box de casal, ar-condicionado e banheiro privativo.<br />Suíte 3: cama box de casal, cama box de solteiro, ar-condicionado e banheiro privativo.<br /><br />Quarto 4: cama box de casal, cama box de solteiro e ar-condicionado.<br />Quarto 5: cama box de casal, cama box de solteiro e ventilador.<br />Quarto 6: duas camas box de solteiro e ventilador.<br /><br />Há ainda 1 banheiro social completo, atendendo os quartos e áreas comuns.<br /><br />A cozinha é ampla e totalmente equipada, ideal para preparar refeições para grupos.<br /><br />A sala de estar é confortável e integrada aos ambientes sociais da casa.<br /><br />Na área externa, a casa conta com área gourmet com churrasqueira e mesa de jantar, além de piscina privativa e campo de futebol privativo com grama natural, perfeitos para momentos de lazer e diversão.<br /><br />A propriedade dispõe de vaga para até 5 carros, garantindo praticidade durante a estadia. pode chegar até 22 pessoas na acomodação mais o valor será cobrado separadamente.<br /><br /><b>Acesso do hóspede<\/b><br />Os hóspedes terão acesso a toda a propriedade, incluindo a casa completa, quartos, banheiros, cozinha, sala de estar, área gourmet com churrasqueira, piscina privativa e campo de futebol privativo.<br /><br />Não há áreas compartilhadas com outros hóspedes.<br />A casa é 100% exclusiva para o grupo durante toda a estadia.<br /><br /><b>Outras observações<\/b><br />– Não são permitidas festas ou eventos na propriedade.<br />– Não é permitido receber visitantes ou hóspedes extras além dos informados na reserva. Em caso de pessoas adicionais, será cobrada taxa.<br />– Não fornecemos roupas de cama, toalhas, travesseiros, cobertores ou itens de praia. O hóspede deve trazer o necessário.<br />– A piscina não possui aquecimento. Pedimos que tomem ducha antes de entrar, evitem o uso de bronzeadores e não consumam alimentos ou bebidas dentro da piscina.<br />– Qualquer dano, quebra ou avaria deve ser comunicado imediatamente para que possamos resolver da melhor forma possível.<br />– Pets são permitidos somente mediante aviso prévio. Eventuais danos causados por animais serão cobrados.<br />– A taxa de limpeza inclui a limpeza padrão da casa e da piscina. Em situações atípicas ou quando houver necessidade de limpeza extra, poderá ser cobrada taxa adicional. O hóspede deve retirar todo o lixo ao final da estadia.","source":"Casa ampla e completa em Itapoá – SC, ideal para famílias e grupos que buscam lazer e tranquilidade.<br />O imóvel conta com piscina privativa, área gourmet com churrasqueira, Wi-Fi, ar-condicionado, cozinha equipada e ambientes espaçosos.<br />São 6 quartos, sendo 3 suítes, além de amplo jardim e excelente estrutura para receber grupos familiares e de amigos com conforto e privacidade.<br />Localização tranquila, a aproximadamente 700 metros da praia, próxima a mercados, padarias e comércios locais.<br /><br /><b>O espaço<\/b><br />A casa oferece 6 quartos no total, sendo 3 suítes, proporcionando conforto e boa distribuição para grupos e famílias.<br /><br />Suíte 1: cama box de casal, cama box de solteiro, ventilador e banheiro privativo.<br />Suíte 2: cama box de casal, ar-condicionado e banheiro privativo.<br />Suíte 3: cama box de casal, cama box de solteiro, ar-condicionado e banheiro privativo.<br /><br />Quarto 4: cama box de casal, cama box de solteiro e ar-condicionado.<br />Quarto 5: cama box de casal, cama box de solteiro e ventilador.<br />Quarto 6: duas camas box de solteiro e ventilador.<br /><br />Há ainda 1 banheiro social completo, atendendo os quartos e áreas comuns.<br /><br />A cozinha é ampla e totalmente equipada, ideal para preparar refeições para grupos.<br /><br />A sala de estar é confortável e integrada aos ambientes sociais da casa.<br /><br />Na área externa, a casa conta com área gourmet com churrasqueira e mesa de jantar, além de piscina privativa e campo de futebol privativo com grama natural, perfeitos para momentos de lazer e diversão.<br /><br />A propriedade dispõe de vaga para até 5 carros, garantindo praticidade durante a estadia. pode chegar até 22 pessoas na acomodação mais o valor será cobrado separadamente.<br /><br /><b>Acesso do hóspede<\/b><br />Os hóspedes terão acesso a toda a propriedade, incluindo a casa completa, quartos, banheiros, cozinha, sala de estar, área gourmet com churrasqueira, piscina privativa e campo de futebol privativo.<b
