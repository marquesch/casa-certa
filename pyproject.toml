[project]
name = "casa-certa"
version = "0.1.0"
description = "Compares Airbnb houses for a family trip"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "apify-client>=3.4.0",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.2",
    "pydantic-ai-slim[openai]>=2.64.0",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.6",
]

[project.scripts]
casa-certa = "casa_certa.cli:main"

[dependency-groups]
dev = [
    "mypy",
    "pre-commit>=4.7.0",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "types-openpyxl>=3.1.5.20261017",
    "types-pyyaml>=6.0.12.20261030",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["casa_certa"]

[tool.ruff]
extend-exclude = ["alembic/versions", "docs"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "C4", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["casa_certa", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits real services and costs money (skipped by default)"]
addopts = "-m 'not live'"
